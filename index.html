<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASG Links</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #111, #000);
  color:#fff;
  text-align:center;
}

/* الكونتينر */
.container{
  max-width:420px;
  margin:auto;
  padding:25px;
}

/* اللوجو */
.logo img{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:25px auto 10px;
  display:block;
  border:2px solid #00ffcc;
  box-shadow:0 0 25px rgba(0,255,204,0.3);
}

/* الاسم */
h1{
  font-size:18px;
  color:#00ffcc;
  margin-bottom:10px;
}

/* سطر صغير تحت الاسم */
.sub{
  font-size:12px;
  color:#aaa;
  margin-bottom:25px;
}

/* أيقونات */
.icons a{
  color:#fff;
  margin:0 10px;
  font-size:22px;
  transition:0.3s;
}
.icons a:hover{
  color:#00ffcc;
  transform:scale(1.3);
}

/* الأزرار */
.link{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  margin:12px 0;
  border-radius:18px;

  background: rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);

  text-decoration:none;
  color:#fff;
  transition:0.3s;
}

.link:hover{
  transform:scale(1.06);
  border-color:#00ffcc;
  background: rgba(0,255,204,0.08);
}

.link i{
  color:#00ffcc;
}

/* الفوتر */
.footer{
  margin-top:30px;
  font-size:11px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

  <!-- اللوجو -->
  <div class="logo">
    <img src="logo.jpeg" alt="ASG Logo">
  </div>

  <!-- الاسم -->
  <h1>مجموعة ASG أفضل منتجات بأفضل سعر</h1>

  <!-- سطر تحت -->
  <div class="sub">📦 شحن لجميع المحافظات | 💬 دعم واتساب مباشر</div>

  <!-- أيقونات -->
  <div class="icons">
    <a href="https://www.facebook.com/share/18VAmaaw3k/" target="_blank">
      <i class="fab fa-facebook"></i>
    </a>

    <a href="https://vm.tiktok.com/ZS9LDyxJKUwce-u38nm/" target="_blank">
      <i class="fab fa-tiktok"></i>
    </a>
  </div>

  <!-- الروابط -->
  <a class="link" href="https://www.facebook.com/share/18VAmaaw3k/" target="_blank">
    <span>فيسبوك</span>
    <i class="fab fa-facebook"></i>
  </a>

  <a class="link" href="https://vm.tiktok.com/ZS9LDyxJKUwce-u38nm/" target="_blank">
    <span>تيك توك</span>
    <i class="fab fa-tiktok"></i>
  </a>

  <a class="link" href="https://wa.me/201507540976" target="_blank">
    <span>واتساب 1</span>
    <i class="fab fa-whatsapp"></i>
  </a>

  <a class="link" href="https://wa.me/201055351759" target="_blank">
    <span>واتساب 2</span>
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- الفوتر -->
  <div class="footer">
    © 2026 ASG | All Rights Reserved
  </div>

</div>

</body>
</html>
