body{
  margin:0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #0d0d0d, #000);
  color:#fff;
  text-align:center;
}

/* خلفية متحركة */
body::before{
  content:"";
  position:fixed;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background: radial-gradient(circle, rgba(0,255,204,0.05), transparent 60%);
  animation: move 10s linear infinite;
  z-index:-1;
}

@keyframes move{
  0%{transform:translate(0,0);}
  50%{transform:translate(5%,5%);}
  100%{transform:translate(0,0);}
}

.container{
  max-width:420px;
  margin:auto;
  padding:25px;
}

/* اللوجو */
.logo img{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:25px auto 10px;
  border:2px solid #00ffcc;
  box-shadow:0 0 25px rgba(0,255,204,0.4);
}

/* العنوان */
h1{
  font-size:18px;
  color:#00ffcc;
}

.sub{
  font-size:12px;
  color:#aaa;
  margin-bottom:20px;
}

/* الأيقونات */
.icons a{
  color:#fff;
  margin:0 12px;
  font-size:24px;
  transition:0.3s;
}

.icons a:hover{
  color:#00ffcc;
  transform:scale(1.3);
}

/* اللينكات */
.link{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  margin:12px 0;
  border-radius:18px;
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  text-decoration:none;
  color:#fff;
  transition:0.3s;
}

.link:hover{
  transform:scale(1.06);
  border-color:#00ffcc;
  background: rgba(0,255,204,0.08);
}

.link i{
  color:#00ffcc;
}

/* الفوتر */
.footer{
  margin-top:25px;
  font-size:11px;
  color:#777;
}
</style>
