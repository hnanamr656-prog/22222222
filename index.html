<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASG App</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#000,#111);
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* Splash */
.splash{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
  transition:0.8s;
}

.splash img{
  width:120px;
  height:120px;
  border-radius:50%;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

/* App frame */
.app{
  width:380px;
  height:90vh;
  background:#000;
  border-radius:35px;
  overflow:hidden;
  box-shadow:0 0 30px rgba(0,255,204,0.2);
  opacity:0;
  transform:translateY(20px);
  transition:0.8s;
  display:flex;
  flex-direction:column;
}

.app.show{
  opacity:1;
  transform:translateY(0);
}

/* header */
.header{
  text-align:center;
  padding:15px;
  background:#0a0a0a;
  border-bottom:1px solid #222;
  color:#fff;
}

/* content */
.container{
  padding:15px;
  overflow-y:auto;
}

/* logo */
.logo img{
  width:90px;
  height:90px;
  border-radius:50%;
  display:block;
  margin:auto;
}

/* links */
.link{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  color:#fff;
  text-decoration:none;
  transition:0.3s;
}

.link:hover{
  background:#00ffcc;
  color:#000;
}

/* icons */
.icons{
  text-align:center;
  margin:10px 0;
}
.icons a{
  color:#fff;
  margin:0 10px;
  font-size:20px;
}

/* dropdown */
.dropdown{
  max-height:0;
  overflow:hidden;
  transition:0.5s;
}
.dropdown.open{
  max-height:600px;
}

/* footer */
.footer{
  text-align:center;
  font-size:11px;
  color:#666;
  padding:10px;
}
</style>
</head>

<body>

<!-- Splash -->
<div class="splash" id="splash">
  <img src="logo.jpeg">
</div>

<!-- App -->
<div class="app" id="app">

<div class="header">
  ASG
</div>

<div class="container">

<div class="logo">
  <img src="logo.jpeg">
</div>

<div class="icons">

  <a href="https://vm.tiktok.com/ZS9LDyxJKUwce-u38nm/"><i class="fab fa-tiktok"></i></a>
  <a href="https://www.instagram.com/ahmedsalah5_24?igsh=MXF4cG9wbGZlNm5mcA=="><i class="fab fa-instagram"></i></a>
  <a href="https://t.me/+cvQqcfpfEm45ZDRk"><i class="fab fa-telegram"></i></a>
</div>

<a class="link" href="https://www.facebook.com/share/18VAmaaw3k/">
Facebook <i class="fab fa-facebook"></i>
</a>

<a class="link" href="https://vm.tiktok.com/ZS9LDyxJKUwce-u38nm/">
TikTok <i class="fab fa-tiktok"></i>
</a>

Instagram <i class="fab fa-instagram"></i>

<div class="footer">© ASG 2026</div>

</div>

</div>

<script>
window.onload=function(){
  setTimeout(()=>{
    document.getElementById("splash").style.display="none";
    document.getElementById("app").classList.add("show");
  },2000);
}
</script>

</body>
</html>
