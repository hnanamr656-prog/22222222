<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASG Links</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #0d0d0d, #000);
  color:#fff;
  text-align:center;
}

/* حركة خلفية */
body::before{
  content:"";
  position:fixed;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background: radial-gradient(circle, rgba(0,255,204,0.05), transparent 60%);
  animation: move 10s linear infinite;
  z-index:-1;
}

@keyframes move{
  0%{transform:translate(0,0);}
  50%{transform:translate(5%,5%);}
  100%{transform:translate(0,0);}
}

.container{
  max-width:420px;
  margin:auto;
  padding:25px;
}

/* اللوجو */
.logo img{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:25px auto 10px;
  border:2px solid #00ffcc;
  box-shadow:0 0 25px rgba(0,255,204,0.4);
}

/* العنوان */
h1{
  font-size:18px;
  color:#00ffcc;
  margin-bottom:5px;
}

.sub{
  font-size:12px;
  color:#aaa;
  margin-bottom:15px;
}

/* زر اللغة */
.lang-btn{
  margin-bottom:20px;
}

.lang-btn button{
  background:transparent;
  border:1px solid #00ffcc;
  color:#00ffcc;
  padding:8px 15px;
  border-radius:20px;
  cursor:pointer;
  transition:0.3s;
}

.lang-btn button:hover{
  background:#00ffcc;
  color:#000;
}

/* أيقونات */
.icons a{
  color:#fff;
  margin:0 10px;
  font-size:22px;
  transition:0.3s;
}

.icons a:hover{
  color:#00ffcc;
  transform:scale(1.3);
}

/* الروابط */
.link{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  margin:12px 0;
  border-radius:18px;

  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);

  text-decoration:none;
  color:#fff;
  transition:0.3s;
}

.link:hover{
  transform:scale(1.06);
  border-color:#00ffcc;
  background: rgba(0,255,204,0.08);
}

.link i{
  color:#00ffcc;
}

/* فوتر */
.footer{
  margin-top:25px;
  font-size:11px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

  <!-- اللوجو -->
  <div class="logo">
    <img src="logo.jpeg" alt="ASG Logo">
  </div>

  <!-- العنوان -->
  <h1 id="title">مجموعة ASG أفضل منتجات بأفضل سعر</h1>

  <div class="sub" id="sub">شحن لجميع المحافظات | دعم واتساب مباشر</div>

  <!-- زر اللغة -->
  <div class="lang-btn">
    <button onclick="toggleLang()">EN / AR</button>
  </div>

  <!-- أيقونات -->
  <div class="icons">
    <a href="https://www.facebook.com/share/18VAmaaw3k/" target="_blank">
      <i class="fab fa-facebook"></i>
    </a>

    <a href="https://vm.tiktok.com/ZS9LDyxJKUwce-u38nm/" target="_blank">
      <i class="fab fa-tiktok"></i>
    </a>
  </div>

  <!-- روابط -->
  <a class="link" id="fb" href="https://www.facebook.com/share/18VAmaaw3k/" target="_blank">
    <span>فيسبوك</span><i class="fab fa-facebook"></i>
  </a>

  <a class="link" id="tt" href="https://vm.tiktok.com/ZS9LDyxJKUwce-u38nm/" target="_blank">
    <span>تيك توك</span><i class="fab fa-tiktok"></i>
  </a>

  <a class="link" id="wa1" href="https://wa.me/201507540976" target="_blank">
    <span>واتساب 1</span><i class="fab fa-whatsapp"></i>
  </a>

  <a class="link" id="wa2" href="https://wa.me/201055351759" target="_blank">
    <span>واتساب 2</span><i class="fab fa-whatsapp"></i>
  </a>

  <div class="footer">© 2026 ASG | Designed with 💚</div>

</div>

<script>
let isEN = false;

function toggleLang(){
  if(!isEN){
    document.getElementById("title").innerText = "ASG Collection - Best Prices";
    document.getElementById("sub").innerText = "Shipping available | WhatsApp support";

    document.getElementById("fb").innerHTML = "<span>Facebook</span><i class='fab fa-facebook'></i>";
    document.getElementById("tt").innerHTML = "<span>TikTok</span><i class='fab fa-tiktok'></i>";
    document.getElementById("wa1").innerHTML = "<span>WhatsApp 1</span><i class='fab fa-whatsapp'></i>";
    document.getElementById("wa2").innerHTML = "<span>WhatsApp 2</span><i class='fab fa-whatsapp'></i>";

    isEN = true;
  } else {
    document.getElementById("title").innerText = "مجموعة ASG أفضل منتجات بأفضل سعر";
    document.getElementById("sub").innerText = "شحن لجميع المحافظات | دعم واتساب مباشر";

    document.getElementById("fb").innerHTML = "<span>فيسبوك</span><i class='fab fa-facebook'></i>";
    document.getElementById("tt").innerHTML = "<span>تيك توك</span><i class='fab fa-tiktok'></i>";
    document.getElementById("wa1").innerHTML = "<span>واتساب 1</span><i class='fab fa-whatsapp'></i>";
    document.getElementById("wa2").innerHTML = "<span>واتساب 2</span><i class='fab fa-whatsapp'></i>";

    isEN = false;
  }
}
</script>

</body>
</html>
